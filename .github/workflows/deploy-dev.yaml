name: Bygg, deploy til dev-fss og lag release

on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENCE"
      - "CODEOWNERS"
    branches:
      - main

jobs:
  build:
    name: Bygg, deploy til dev-fss og lag release
    permissions:
      packages: write
      contents: write
      id-token: write
    secrets: inherit
    uses: navikt/hm-workflows/.github/workflows/deploy-dev.yaml@main
    with:
      environment: 'dev-fss:teamdigihot'
      manifest: .nais/nais-dev.yaml
      cluster: dev-fss
      java-version: '25'
