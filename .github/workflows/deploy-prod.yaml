name: Deploy til prod-gcp

on:
  release:
    types:
      - published

jobs:
  deploy:
    name: Deploy til prod-fss
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: navikt/hm-workflows/.github/workflows/deploy-prod.yaml@main
    with:
      environment: 'prod-fss:teamdigihot'
      manifest: .nais/nais-prod.yaml
      cluster: prod-fss
